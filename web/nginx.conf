# Nginx de la imagen prod del frontend (RF-3, R6): sw.js, sync.js e index.html nunca se cachean,
# para que los usuarios reciban siempre la versión vigente del Service Worker.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión (PRD §4, R14): el JS, el CSS y el JSON viajan en gzip (~3x menos bytes bajo 3G). Los PNG ya van
    # comprimidos y no se tocan. shortcut: solo gzip (la imagen de Nginx no trae Brotli); Vercel sirve la PWA con Brotli.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # shortcut: max-age largo también para archivos sin hash (manifest.json, icons/); si cambian sin renombrarse, acotar a /assets/.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=31536000";
    }

    # sync.js lo importa sw.js: con max-age largo el navegador seguiría usando una copia vieja del envío de reportes.
    location ~ ^/(sw|sync)\.js$ {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
