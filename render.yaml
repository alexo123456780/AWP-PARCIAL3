# Blueprint de Render (PRD §5.8): API NestJS en Docker + PostgreSQL. El frontend se despliega en Vercel.
# No hay auto-deploy: GitHub Actions migra con Liquibase y después llama al deploy hook (.github/workflows/ci.yml),
# así el esquema siempre está al día antes de que arranque la versión nueva de la API.
databases:
  - name: civicguard-db
    databaseName: civicguard
    user: civicguard
    postgresMajorVersion: '16'
    # shortcut: Postgres gratis de Render expira a los 30 días (más 14 de gracia); pasar a un plan de pago antes.
    plan: free

services:
  - type: web
    name: civicguard-api
    runtime: docker
    # Render construye la última etapa del Dockerfile: `prod` (imagen mínima, usuario no root).
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    branch: prod
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    # shortcut: el plan gratis duerme tras 15 min sin tráfico (arranque en frío de ~1 min); subir de plan para la demo.
    plan: free
    envVars:
      # Render inyecta PORT; la API lo lee. La conexión interna no sale a internet.
      - key: DATABASE_URL
        fromDatabase:
          name: civicguard-db
          property: connectionString
      # Origen del frontend en Vercel (el proyecto debe llamarse civicguard-pwa; si no, ajusta este valor).
      - key: CORS_ORIGINS
        value: https://civicguard-pwa.vercel.app
      # Fotos en Supabase Storage (bucket público). `sync: false`: los valores se capturan en el panel de Render,
      # nunca en este archivo. Sin ellos la API arranca, pero un reporte con foto responde 503 y queda pendiente.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: incident-photos
      # Firma de los JWT del coordinador: Render genera un valor aleatorio propio y nunca sale de su panel.
      - key: JWT_SECRET
        generateValue: true
      # Un proxy (el de Render) delante de la API: sin esto el límite de login sería uno solo para todos los clientes.
      - key: TRUST_PROXY
        value: '1'
      # Web Push (RF-8): par VAPID (`npx web-push generate-vapid-keys` dentro de api/) y contacto (`mailto:` o URL https).
      # `sync: false`: se capturan en el panel de Render, nunca aquí. Sin ellas la API arranca, pero no hay avisos push.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
