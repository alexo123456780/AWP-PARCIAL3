name: CI

on:
  pull_request:
    branches: [develop, prod]
  push:
    branches: [develop, prod]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    env:
      HUSKY: '0' # los hooks locales no aplican en CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
