name: CI

on:
  pull_request:
    branches: [develop, prod]
  push:
    branches: [develop, prod]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    env:
      HUSKY: '0' # los hooks locales no aplican en CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # API (api/ tiene su propio package.json): compila y corre sus pruebas.
      - run: npm ci --prefix api
      - run: npm run build --prefix api
      - run: npm test --prefix api
      # PWA (web/ tiene su propio package.json): comprueba tipos, genera dist/ y corre sus pruebas.
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      # Presupuesto de rendimiento (R14): falla si el JS inicial supera 150 KB gzip.
      - run: npm run check:bundle --prefix web
      - run: npm test --prefix web

  # Despliegue continuo del backend (PRD §5.8), solo en push a `prod` y tras pasar `lint-and-test`:
  # migrar la base -> desplegar la API en Render. La PWA no se despliega aquí: la integración Git de Vercel
  # (rama de producción `prod`) la construye al recibir el push.
  # DEPLOY_ENABLED (variable del repositorio) es el interruptor: sin ella el job se omite, así `prod` no
  # queda en rojo antes de configurar Render; ponla en `false` (o bórrala) para pausar los despliegues.
  # Los secretos viven en el entorno `production`, restringido a la rama `prod` (ver README, «Despliegue»).
  deploy-backend:
    name: deploy-backend
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Migrar la base de producción con Liquibase
        env:
          # Credenciales por entorno del contenedor (no por argumentos) y siempre con `sslmode=require` en la URL.
          LIQUIBASE_COMMAND_URL: ${{ secrets.DB_JDBC_URL }}
          LIQUIBASE_COMMAND_USERNAME: ${{ secrets.DB_USER }}
          LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Misma imagen (versión fijada) que usa el servicio `liquibase` de docker-compose.yml.
          image=$(grep -oE 'liquibase/liquibase:[0-9.]+' docker-compose.yml)
          docker run --rm -e LIQUIBASE_COMMAND_URL -e LIQUIBASE_COMMAND_USERNAME -e LIQUIBASE_COMMAND_PASSWORD \
            -v "$PWD/db/changelog:/liquibase/changelog:ro" "$image" \
            --changelog-file=changelog/db.changelog-root.yaml update
      - name: Desplegar la API en Render (el commit exacto de esta ejecución)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --get --data-urlencode "ref=${GITHUB_SHA}" --output /dev/null "$RENDER_DEPLOY_HOOK_URL"
      - name: Esperar a que la API responda sana
        env:
          API_URL: ${{ vars.API_URL }}
        # shortcut: mientras Render construye, la versión anterior sigue respondiendo y este chequeo pasa; para
        # confirmar la versión nueva habría que consultar la API de Render (requiere una API key) o exponer el commit.
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$API_URL/api/health" | grep -q '"database":"up"'; then
              echo "API sana tras $attempt intento(s)"; exit 0
            fi
            sleep 10
          done
          echo "La API no respondió sana en 10 minutos" >&2; exit 1

  # R11 (PRD §9): un changeset editado después de aplicarse rompe su checksum. Se aplica a un Postgres
  # temporal el changelog de la rama base y se valida contra esa BD el de la PR; después se comprueba
  # que los changesets sean reversibles (rollback de todos + update).
  liquibase-validate:
    name: liquibase-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # BD efímera del runner, sin datos reales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Validar y probar el changelog con Liquibase
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ci
        run: |
          set -euo pipefail
          # Misma imagen (versión fijada) que usa el servicio `liquibase` de docker-compose.yml.
          image=$(grep -oE 'liquibase/liquibase:[0-9.]+' docker-compose.yml)
          lb() { # lb <carpeta del changelog> <comando de liquibase>
            docker run --rm --network host -v "$PWD/$1:/liquibase/changelog:ro" "$image" \
              --url="$DB_URL" --username=ci --password=ci \
              --changelog-file=changelog/db.changelog-root.yaml "${@:2}"
          }
          if [ -d base/db/changelog ]; then lb base/db/changelog update; fi
          lb db/changelog validate
          lb db/changelog update
          lb db/changelog rollback-count --count="$(cat db/changelog/migrations/*.sql | grep -c '^--changeset')"
          lb db/changelog update
